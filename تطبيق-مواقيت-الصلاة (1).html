:root{--blue:#0b2a5c;--gold:#d4af37;--bg:#f6f8fc}
*{box-sizing:border-box;font-family:'Cairo',sans-serif}
body{margin:0;background:var(--bg);color:#111}
header{background:linear-gradient(135deg,var(--blue),#143a7a);color:#fff;padding:28px 16px;text-align:center}

.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;padding:16px;max-width:1150px;margin:-20px auto 0}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.06);border:1px solid #eef}

.big{font-size:24px;font-weight:800;color:var(--blue)}
.gold{color:var(--gold)}

button,select,input{padding:10px 14px;border-radius:12px;border:1px solid #ddd;background:#fff;cursor:pointer;font-family:'Cairo'}
button.primary{background:var(--gold);border:none;color:#111;font-weight:700}
table{width:100%;border-collapse:separate;border-spacing:0;max-width:1150px;margin:12px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.06)}
th,td{padding:11px 8px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:14px}
th{background:#fafbff;color:var(--blue);position:sticky;top:0}
tr.today{background:linear-gradient(90deg,#fff7d6,#fff);box-shadow:inset 0 0 0 2px var(--gold)}
tr.friday{background:#f6fff6}
tr:hover{background:#f9fbff}
footer{text-align:center;padding:24px;color:#666;font-size:13px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420}body{color:#e6e6e6}.card,table,button,select,input{background:#141b2d;border-color:#223}th{background:#101728;color:#9bb4ff}tr:hover{background:#18213a}}
